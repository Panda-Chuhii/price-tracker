<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Tracker</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ range(1, 99999) | random }}">
</head>
<body>
  <!-- Popup notification -->
<div id="popup-container" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;"></div>

<script>
  function showPopup(title, message, type='success') {
    const container = document.getElementById('popup-container');
    const popup = document.createElement('div');
    popup.style.cssText = `
      background: white;
      border-radius: 12px;
      padding: 16px 20px;
      min-width: 300px;
      max-width: 380px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      border-left: 4px solid ${type === 'success' ? '#10b981' : '#6366f1'};
      animation: slideIn 0.3s ease;
      cursor: pointer;
    `;
    popup.innerHTML = `
      <div style="font-weight:700;font-size:14px;color:#1a1a2e;margin-bottom:4px">${title}</div>
      <div style="font-size:13px;color:#6b7280">${message}</div>
    `;
    popup.onclick = () => popup.remove();
    container.appendChild(popup);
    setTimeout(() => popup.remove(), 5000);
  }

  // Check for flash messages and show as popups too
  document.addEventListener('DOMContentLoaded', function() {
    const flashes = document.querySelectorAll('.flash');
    flashes.forEach(flash => {
      showPopup('Notice', flash.textContent.trim());
    });
  });
</script>

<style>
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
</style>
  <script>
  // Register service worker for push notifications
  if ('serviceWorker' in navigator && 'PushManager' in window) {
    navigator.serviceWorker.register('/static/sw.js')
    .then(function(reg) {
      console.log('Service worker registered');
    });
  }

  function enableNotifications() {
    Notification.requestPermission().then(function(permission) {
      if (permission === 'granted') {
        alert('Notifications enabled! You will be alerted when prices drop.');
      }
    });
  }
</script>
<nav>
  <a href="{{ url_for('alerts') }}" class="nav-profile">Alerts</a>
  <a href="{{ url_for('dashboard') }}" class="brand">Price<span class="track">Track</span><span class="dot">.</span></a>
  {% if current_user.is_authenticated %}
    <span class="user-email">{{ current_user.email }}</span>
    <a href="{{ url_for('profile') }}" class="nav-profile">Profile</a>
<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
<button class="theme-toggle" onclick="enableNotifications()">🔔 Alerts</button>
    <a href="{{ url_for('logout') }}">Logout</a>
  {% endif %}
</nav>

<script>
  function toggleTheme() {
    const body = document.body;
    const btn = document.getElementById('themeBtn');
    if (body.classList.contains('dark')) {
      body.classList.remove('dark');
      btn.textContent = '🌙 Dark';
      localStorage.setItem('theme', 'light');
    } else {
      body.classList.add('dark');
      btn.textContent = '☀️ Light';
      localStorage.setItem('theme', 'dark');
    }
  }

  // Remember theme on page load
  window.onload = function() {
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
      document.body.classList.add('dark');
      const btn = document.getElementById('themeBtn');
      if (btn) btn.textContent = '☀️ Light';
    }
  }
</script>

  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="flash">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

</body>
</html>
