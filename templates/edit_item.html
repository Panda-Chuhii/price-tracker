{% extends "base.html" %}
{% block content %}

<a href="{{ url_for('dashboard') }}" class="back-link">← Back to dashboard</a>
<h2>Edit item</h2>

<div class="add-form">
  <form method="POST">
    <input type="text" name="name" value="{{ item.product_name }}" placeholder="Product name" required>
    <input type="url" name="url" value="{{ item.url }}" placeholder="Product URL" required>
    <input type="number" name="target_price" value="{{ item.target_price }}" placeholder="Target price" step="0.01" required>
    <input type="url" name="image_url" value="{{ item.image_url or '' }}" placeholder="Image URL (optional)">
    <button type="submit">Save changes</button>
  </form>
</div>

{% endblock %}
